[project]
name = "ear-training"
version = "0.1.0"
description = "MIDI chord ear-training CLI"
requires-python = ">=3.10"
dependencies = [
  "mido>=1.3.3",
  "python-rtmidi>=1.5.8",
  "PyYAML>=6.0.3",
]

[project.scripts]
ear-training = "ear_training.cli:main"

[tool.setuptools.packages.find]
include = ["ear_training*"]

[tool.setuptools.package-data]
ear_training = ["chords.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
